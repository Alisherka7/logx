name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / node ${{ matrix.node }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22", python: "3.10" }
          - { os: ubuntu-latest, node: "26", python: "3.14" }
          - { os: macos-latest, node: "24", python: "3.13" }
          - { os: windows-latest, node: "24", python: "3.13" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:python
      - run: npx vitest run
      - run: node scripts/smoke-pack.mjs
